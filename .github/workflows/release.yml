name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AFB59C: ${{ secrets.AFB59C }}
          BC9D1D: ${{ secrets.BC9D1D }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AFB59C', '')
          tag_b = os.environ.get('BC9D1D', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 79cdf2c10eac82253fed80c42a9a5f3e75e0f07aa69b25cc -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- e12df035a80244afe1c0f40e83b256fe689259f07a -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
